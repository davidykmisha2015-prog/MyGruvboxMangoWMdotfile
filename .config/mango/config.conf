# Конфігурація MangoWM (MangoWC 0.18.0)

# Монітор: 3440x1440 @ 165 Гц
monitor_rule=name:DP-1,width:3440,height:1440,refresh:165,x:0,y:0,scale:1
auto_reload_config=1

# Автозапуск (PipeWire портали для OBS + Waybar + SwayNC + Шпалери)
exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=mango && systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && systemctl --user start nixos-fake-graphical-session.target && systemctl --user restart xdg-desktop-portal-wlr xdg-desktop-portal
exec_once=pkill waybar; waybar
exec_once=pkill swaync; swaync
exec_once=pkill awww-daemon; awww-daemon & sleep 0.5 && /home/justadux/.config/mango/scripts/random-wallpaper.sh

# Ефекти вікон (SceneFX: розмиття, тіні, заокруглені кути)
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

shadows=1
layer_shadows=0
shadow_only_floating=1
shadows_size=12
shadows_blur=15
shadows_position_x=0
shadows_position_y=4
shadows_color=0x000000aa

border_radius=8
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.96

# Анімації вікон та тегів
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=400
animation_duration_open=350
animation_duration_tag=350
animation_duration_close=300
animation_duration_focus=150
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Налаштування тайлінгу та Scroller (стрічки)
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=1
scroller_prefer_center=1
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Клавіатура (US + UA на Alt + Shift)
repeat_rate=35
repeat_delay=300
numlock_on=1
xkb_rules_layout=us,ua
xkb_rules_options=grp:alt_shift_toggle

# Мишка та фокус
sloppy_focus=1
warp_cursor=0
cursor_size=24
drag_tile_to_tile=1

# Зовнішній вигляд (Gruvbox)
gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=8
gap_outer_vertical=8
border_px=3
root_color=0x282828ff
border_color=0x504945ff
focus_color=0x83a598ff
maximized_screen_color=0xfabd2fff
urgent_color=0xfb4934ff
scratchpad_color=0xd3869bff
global_color=0xb8bb26ff
overlay_color=0x8ec07cff

# Налаштування Dwindle (як за замовчуванням у Hyprland / bspwm)
dwindle_smart_split=1
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=1

# Розкладка за замовчуванням для тегів 1..9 — Dwindle (як у Hyprland)
tag_rule=id:1,layout_name:dwindle
tag_rule=id:2,layout_name:dwindle
tag_rule=id:3,layout_name:dwindle
tag_rule=id:4,layout_name:dwindle
tag_rule=id:5,layout_name:dwindle
tag_rule=id:6,layout_name:dwindle
tag_rule=id:7,layout_name:dwindle
tag_rule=id:8,layout_name:dwindle
tag_rule=id:9,layout_name:dwindle

# === ГАРЯЧІ КЛАВІШІ (як у твоєму River) ===

# Перезавантажити конфіг на льоту (Win + R)
bind=SUPER,r,reload_config

# Повернути поділ вікон вертикально/горизонтально у Dwindle (Win + V, як у Hyprland)
bind=SUPER,v,dwindle_toggle_current_split

# Термінал, Rofi, Сповіщення, Шпалери та Локскрін
bind=SUPER,Return,spawn,kitty
bind=SUPER,d,spawn,rofi -show drun
bind=SUPER,n,spawn,swaync-client -t -sw
bind=SUPER,w,spawn,/home/justadux/.config/mango/scripts/random-wallpaper.sh
bind=SUPER,l,spawn,hyprlock

# Закрити вікно та вийти з MangoWM
bind=SUPER,q,killclient
bind=SUPER+SHIFT,e,quit

# Режими вікон (Win + Space — плаваюче вікно, Win + F — змінити режим тайлінгу, Win + Shift + F — на весь екран)
bind=SUPER,space,togglefloating
bind=SUPER,f,switch_layout
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,a,togglemaximizescreen

# Фокус між вікнами (Win + стрілки або Win + Tab)
bind=SUPER,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Переміщення вікон у сітці (Win + Shift + стрілки)
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right

# Перемикання робочих столів / тегів (Win + 1..9)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Перенесення активного вікна на інший тег (Win + Shift + 1..9)
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Керування вікнами мишкою (Win + ЛКМ тягає вікно, Win + ПКМ змінює розмір)
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Плавна анімація появи меню Rofi та панелі сповіщень
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi
layer_rule=animation_type_open:slide,layer_name:sway-notification-center
layer_rule=animation_type_close:slide,layer_name:sway-notification-center

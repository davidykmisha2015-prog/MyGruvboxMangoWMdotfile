# Hyprlock Configuration - Gruvbox Style

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

# ФОН (Розмиті поточні шпалери або колір Gruvbox)
background {
    monitor =
    path = $HOME/.cache/current_wallpaper
    color = rgba(29, 32, 33, 1.0)

    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.75
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ГОДИННИК (HH:MM)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(235, 219, 178)
    font_size = 85
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 240
    halign = center
    valign = center
}

# ДАТА (День тижня, число місяць)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgb(168, 153, 132)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

# АВАТАРКА КОРИСТУВАЧА (Кругла з Gruvbox обводкою)
image {
    monitor =
    path = $HOME/.config/mango/avatar.png
    size = 110
    rounding = -1
    border_size = 3
    border_color = rgb(131, 165, 152)
    rotate = 0
    reload_time = -1
    position = 0, 65
    halign = center
    valign = center
}

# ПОЛЕ ВВОДУ ПАРОЛЯ
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(80, 73, 69)
    inner_color = rgb(40, 40, 40)
    font_color = rgb(235, 219, 178)
    fade_on_empty = false
    placeholder_text = <span foreground="##a89984"><i>Введіть пароль...</i></span>
    hide_input = false
    rounding = 10
    check_color = rgb(250, 189, 47)
    fail_color = rgb(251, 73, 52)
    fail_text = <i>Невірний пароль! ($ATTEMPTS)</i>
    position = 0, -35
    halign = center
    valign = center
}

# МЕДІАПЛЕЄР (Назва треку + артист + статус)
label {
    monitor =
    text = cmd[update:2000] $HOME/.config/hypr/scripts/mediaplayer.sh
    color = rgb(142, 192, 124)
    font_size = 14
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -110
    halign = center
    valign = center
}
